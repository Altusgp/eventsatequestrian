<div style="font-family: 'Segoe UI', Arial, sans-serif; background-color: #F6F0E4; padding: 40px 16px;">
  <table role="presentation" style="max-width: 660px; margin: 0 auto; background-color: #FFFFFF; border-radius: 10px; overflow: hidden; border-collapse: collapse; box-shadow: 0 2px 12px rgba(9,35,34,0.14);">

    <tr>
      <td style="background-color: #092322; padding: 36px 40px;">
        <div style="color: #D9B684; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px;">Events at Equestrian Woods</div>
        <div style="color: #F6F0E4; font-size: 30px; font-weight: bold;">New Event Inquiry</div>
      </td>
    </tr>

    <tr>
      <td style="padding: 34px 40px 10px 40px;">
        <div style="display: inline-block; background-color: #FBF7EF; border: 1px solid #E2D6C0; border-radius: 24px; padding: 9px 20px; color: #8A5E33; font-size: 16px; font-weight: bold;">
          👤 {{name}}
        </div>
        <div style="color: #999999; font-size: 14px; margin-top: 10px;">Submitted {{time}}</div>
      </td>
    </tr>

    <tr>
      <td style="padding: 18px 40px;">
        <table role="presentation" style="width: 100%; border-collapse: collapse;">
          <tr>
            <td style="padding: 16px 18px; background-color: #FBF7EF; border-radius: 6px 0 0 6px; color: #8A5E33; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; width: 40%;">✉️ Email</td>
            <td style="padding: 16px 18px; background-color: #FBF7EF; border-radius: 0 6px 6px 0; color: #092322; font-size: 17px; font-weight: bold;">{{email}}</td>
          </tr>
          <tr><td colspan="2" style="height: 8px;"></td></tr>
          <tr>
            <td style="padding: 16px 18px; background-color: #F3ECE0; border-radius: 6px 0 0 6px; color: #8A5E33; font-size: 14px; letter-spacing: 1px; text-transform: uppercase;">📞 Phone</td>
            <td style="padding: 16px 18px; background-color: #F3ECE0; border-radius: 0 6px 6px 0; color: #092322; font-size: 17px; font-weight: bold;">{{phone}}</td>
          </tr>
          <tr><td colspan="2" style="height: 8px;"></td></tr>
          <tr>
            <td style="padding: 16px 18px; background-color: #FBF7EF; border-radius: 6px 0 0 6px; color: #8A5E33; font-size: 14px; letter-spacing: 1px; text-transform: uppercase;">🎉 Event Type</td>
            <td style="padding: 16px 18px; background-color: #FBF7EF; border-radius: 0 6px 6px 0; color: #092322; font-size: 17px; font-weight: bold;">{{type}}</td>
          </tr>
          <tr><td colspan="2" style="height: 8px;"></td></tr>
          <tr>
            <td style="padding: 16px 18px; background-color: #F3ECE0; border-radius: 6px 0 0 6px; color: #8A5E33; font-size: 14px; letter-spacing: 1px; text-transform: uppercase;">📅 Preferred Date</td>
            <td style="padding: 16px 18px; background-color: #F3ECE0; border-radius: 0 6px 6px 0; color: #092322; font-size: 17px; font-weight: bold;">{{date}}</td>
          </tr>
        </table>
      </td>
    </tr>

    <tr>
      <td style="padding: 10px 40px 36px 40px;">
        <div style="color: #8A5E33; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px;">💬 Message</div>
        <div style="background-color: #092322; color: #F6F0E4; padding: 20px 22px; border-radius: 8px; font-size: 17px; line-height: 1.7; white-space: pre-wrap;">{{message}}</div>
      </td>
    </tr>

    <tr>
      <td style="background-color: #F3ECE0; padding: 20px 40px; text-align: center; color: #8A5E33; font-size: 14px;">
        Please respond to this inquiry at your earliest convenience.
      </td>
    </tr>

  </table>
</div>
